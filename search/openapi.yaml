openapi: 3.1.0
info:
  title: Teeth Search API
  version: 0.1.0
  description: |
    Semantic search over the local Wikipedia dump in `data/`.
    Ranking uses pre-calculated word embeddings, so matching is by meaning
    rather than exact keywords.

    This document is the contract between the Rust search engine and every
    client. The Rust service must validate responses against it, and
    `frontend/src/protocol.js` mirrors it for client-side validation.

    Errors use RFC 9457 problem details (`application/problem+json`).
servers:
  - url: http://127.0.0.1:8080
    description: Local search engine
tags:
  - name: search
  - name: documents
  - name: service

paths:
  /search:
    get:
      tags: [search]
      operationId: search
      summary: Semantic search over the corpus
      parameters:
        - name: q
          in: query
          required: true
          description: Natural language query. Matched against embeddings.
          schema:
            type: string
            minLength: 1
            maxLength: 2000
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          description: Number of results to skip (pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Ranked results, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /doc/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Fetch a full document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The full document text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/Problem"

  /health:
    get:
      tags: [service]
      operationId: health
      summary: Liveness and index status
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"

components:
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    SearchResult:
      type: object
      required: [id, title, score]
      properties:
        id:
          type: string
          description: Stable document ID, usable with GET /doc/{id}.
        title:
          type: string
        score:
          type: number
          description: Similarity in [0, 1]. Higher is a better match.
          minimum: 0
          maximum: 1
        snippet:
          type: string
          description: Leading excerpt of the matched passage, if available.
        url:
          type: string
          format: uri
          description: Original Wikipedia URL for the article.

    SearchResponse:
      type: object
      required: [query, took_ms, total, results]
      properties:
        query:
          type: string
        took_ms:
          type: number
          description: Server-side latency in milliseconds.
        total:
          type: integer
          description: Total matches before limit/offset applied.
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    Section:
      type: object
      required: [heading, text]
      properties:
        heading:
          type: string
        text:
          type: string

    Document:
      type: object
      required: [id, title, text]
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        url:
          type: string
          format: uri
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"

    Health:
      type: object
      required: [status, index]
      properties:
        status:
          type: string
          enum: [ok]
        index:
          type: object
          required: [documents, embeddings]
          properties:
            documents:
              type: integer
              description: Number of documents indexed.
            embeddings:
              type: integer
              description: Number of embedding vectors loaded.
            build_time:
              type: string
              description: When the index was last built.

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
